<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Authentication</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div id="toast" class="toast hidden"></div>

    <div class="wrapper">
        
       
        <div id="register-container" class="form-container hidden">
            <h2>Create an Account</h2>
            <form id="register-form">
                <div class="input-box">
                    <input type="text" id="reg-username" required placeholder=" ">
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <input type="email" id="reg-email" required placeholder=" ">
                    <label>Email Address</label>
                </div>
                
                <div class="input-box password-box">
                    <input type="password" id="reg-password" required minlength="6" placeholder=" ">
                    <label>Password (Min 6 chars)</label>
                    <span class="toggle-password" onclick="toggleVisibility('reg-password')">👁</span>
                </div>
                
                <button type="submit" class="btn">Register</button>
            </form>
            <p>Already have an account? <span class="link" onclick="switchTab('login')">Login here</span></p>
        </div>

       
        <div id="login-container" class="form-container">
            <h2>Welcome Back</h2>
            <form id="login-form">
                <div class="input-box">
                    <input type="email" id="login-email" required placeholder=" ">
                    <label>Email Address</label>
                </div>
                
                <div class="input-box password-box">
                    <input type="password" id="login-password" required placeholder=" ">
                    <label>Password</label>
                    <span class="toggle-password" onclick="toggleVisibility('login-password')">👁</span>
                </div>
                
                
                <div class="remember-box">
                    <label>
                        <input type="checkbox" id="remember-me"> Remember Me
                    </label>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>
            <p>Don't have an account? <span class="link" onclick="switchTab('register')">Register here</span></p>
        </div>

        
        <div id="dashboard-container" class="form-container hidden dashboard">
            <h2 id="dashboard-greeting">Hello, User!</h2>
            <p>You have successfully logged into the protected session.</p>
            <div class="card">
                <h3>Your Details:</h3>
                <p><strong>Username:</strong> <span id="dash-username"></span></p>
                <p><strong>Status:</strong> Authenticated ✔️</p>
            </div>
            <button class="btn btn-logout" onclick="logout()">Log Out</button>
        </div>

    </div>

   
    <script src="script.js"></script>
</body>
</html>
